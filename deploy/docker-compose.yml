# Run from repo root: docker compose -f deploy/docker-compose.yml up -d --build
services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
      args:
        OCR_EXTRA: ${OCR_EXTRA:-0}
    image: indoor-nav-backend:local
    env_file:
      - ../backend/.env
    environment:
      DATA_DIR: /data              # forced here, wins over .env
      BACKEND_HOST: 0.0.0.0        # container only; host publish below stays loopback
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${DATA_HOST_DIR:-../backend/data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
