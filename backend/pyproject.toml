[project]
name = "indoor-nav-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "imagehash>=4.3.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyobjc-framework-vision>=12.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
